name: Sweep pending channel publications

# Publishes scheduled drops to the channels their launch had to leave behind.
# See brands/scripts/sweep_pending_publications.py.
#
# There is nothing to schedule per drop. publish_by_product_or_collection_id
# tags what it defers, this drains the queue, and the tag comes off once the
# product is on every channel. A product whose launch has not happened is left
# queued, so running early is harmless and running late only delays.
#
# Cadence is a cost trade-off, not a correctness one. Each run spends roughly a
# minute on checkout and uv sync before it queries anything, so an every-15-
# minutes sweep is ~4,300 Actions minutes a month whether or not a drop is
# happening. Hourly is the baseline here; fire repository_dispatch from Cloud
# Scheduler or Flow to close the gap around a known launch.
#
# Trigger by HTTP POST:
#   curl -X POST \
#     -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer $GITHUB_TOKEN" \
#     https://api.github.com/repos/taro-arumakan/shopify_product_management/dispatches \
#     -d '{"event_type":"sweep-pending-publications"}'

on:
  repository_dispatch:
    types: [sweep-pending-publications]
  schedule:
    # Hourly. GitHub queues these best-effort and they run late, which is fine
    # for a queue drain — it is the floor, not the mechanism.
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Shopify に書き込まず実行内容だけ確認する"
        required: false
        default: true
        type: boolean
      shop:
        description: "1 店舗だけ処理する (例: kume)。空欄 = 全店舗"
        required: false
        type: string

# Read-then-write per product: two overlapping sweeps could both see the same
# product as pending and publish it twice.
concurrency:
  group: sweep-pending-publications
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.21"

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Create Google credentials file
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "$GOOGLE_CREDENTIALS_JSON" > /tmp/google-credentials.json
          chmod 600 /tmp/google-credentials.json

      - name: Create .env file
        run: |
          cat > .env << EOF
          GOOGLE_CREDENTIAL_PATH=/tmp/google-credentials.json
          ssilkr-ACCESS_TOKEN=${{ secrets.SSILKR_ACCESS_TOKEN }}
          ssilkr-GSPREAD_ID=${{ secrets.SSILKR_GSPREAD_ID }}
          rohseoul-ACCESS_TOKEN=${{ secrets.ROHSEOUL_ACCESS_TOKEN }}
          rohseoul-GSPREAD_ID=${{ secrets.ROHSEOUL_GSPREAD_ID }}
          kumej-ACCESS_TOKEN=${{ secrets.KUMEJ_ACCESS_TOKEN }}
          kumej-GSPREAD_ID=${{ secrets.KUMEJ_GSPREAD_ID }}
          lememek-ACCESS_TOKEN=${{ secrets.LEMEMEK_ACCESS_TOKEN }}
          lememek-GSPREAD_ID=${{ secrets.LEMEMEK_GSPREAD_ID }}
          blossomhcompany-ACCESS_TOKEN=${{ secrets.BLOSSOMHCOMPANY_ACCESS_TOKEN }}
          blossomhcompany-GSPREAD_ID=${{ secrets.BLOSSOMHCOMPANY_GSPREAD_ID }}
          apricot-studios-ACCESS_TOKEN=${{ secrets.APRICOT_STUDIOS_ACCESS_TOKEN }}
          apricot-studios-GSPREAD_ID=${{ secrets.APRICOT_STUDIOS_GSPREAD_ID }}
          archive-epke-ACCESS_TOKEN=${{ secrets.ARCHIVE_EPKE_ACCESS_TOKEN }}
          archive-epke-GSPREAD_ID=${{ secrets.ARCHIVE_EPKE_GSPREAD_ID }}
          gbhjapan-ACCESS_TOKEN=${{ secrets.GBHJAPAN_ACCESS_TOKEN }}
          gbhjapan-GSPREAD_ID=${{ secrets.GBHJAPAN_GSPREAD_ID }}
          asheis-ACCESS_TOKEN=${{ secrets.ASHEIS_ACCESS_TOKEN }}
          asheis-GSPREAD_ID=${{ secrets.ASHEIS_GSPREAD_ID }}
          EOF

      - name: Sweep
        env:
          PYTHONPATH: .
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_SHOP: ${{ github.event.inputs.shop }}
        run: |
          ARGS=""

          # Only a manual run defaults to looking rather than publishing.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_SHOP" ]; then
              ARGS="$ARGS --shop $INPUT_SHOP"
            fi
            if [ "$INPUT_DRY_RUN" != "true" ]; then
              ARGS="$ARGS --apply"
            fi
          else
            ARGS="--apply"
          fi

          uv run brands/scripts/sweep_pending_publications.py $ARGS
